<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thomas Hedlund — Drummer</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      var theme =
        stored || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <main class="page">
    <div class="content">
      <header class="intro">
        <h1 class="intro__name">Thomas Hedlund</h1>
        <p class="intro__role">Drummer</p>
      </header>

      <section class="accordion" id="accordion" aria-label="Discography">
        <!-- Rendered by script.js from the SECTIONS data array -->
      </section>
    </div>

    <footer class="contact">
      <div class="contact__info">
        <p class="contact__label">Contact</p>
        <p class="contact__value">
          <a href="mailto:management@thomashedlund.se">management@thomashedlund.se</a>
        </p>
      </div>

      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        role="switch"
        aria-checked="false"
        aria-label="Switch to light mode"
      >
        <span class="theme-toggle__icon theme-toggle__icon--dark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <path d="M7.2,2.3c-1,4.4,1.7,8.7,6.1,9.8c0.1,0,0.1,0,0.2,0c-1.1,1.2-2.7,1.8-4.3,1.8c-0.1,0-0.2,0-0.2,0C5.6,13.8,3,11,3.2,7.7C3.2,5.3,4.8,3.1,7.2,2.3 M8,1L8,1C4.1,1.6,1.5,5.3,2.1,9.1c0.6,3.3,3.4,5.8,6.8,5.9c0.1,0,0.2,0,0.3,0c2.3,0,4.4-1.1,5.8-3c0.2-0.2,0.1-0.6-0.1-0.7c-0.1-0.1-0.2-0.1-0.3-0.1c-3.9-0.3-6.7-3.8-6.4-7.6C8.3,3,8.4,2.4,8.6,1.8c0.1-0.3,0-0.6-0.3-0.7C8.1,1,8.1,1,8,1z"/>
          </svg>
        </span>
        <span class="theme-toggle__icon theme-toggle__icon--light" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <path d="M7.5 1H8.5V3.5H7.5z"/><path d="M10.8 3.4H13.3V4.4H10.8z" transform="rotate(-45 12.074 3.922)"/><path d="M12.5 7.5H15V8.5H12.5z"/><path d="M11.6 10.8H12.6V13.3H11.6z" transform="rotate(-45 12.077 12.075)"/><path d="M7.5 12.5H8.5V15H7.5z"/><path d="M2.7 11.6H5.2V12.6H2.7z" transform="rotate(-45 3.929 12.078)"/><path d="M1 7.5H3.5V8.5H1z"/><path d="M3.4 2.7H4.4V5.2H3.4z" transform="rotate(-45 3.926 3.925)"/><path d="M8,6c1.1,0,2,0.9,2,2s-0.9,2-2,2S6,9.1,6,8S6.9,6,8,6 M8,5C6.3,5,5,6.3,5,8s1.3,3,3,3s3-1.3,3-3S9.7,5,8,5z"/>
          </svg>
        </span>
      </button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
